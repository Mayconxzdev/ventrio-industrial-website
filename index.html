  <!-- Open Graph -->

  <meta property="og:type" content="website" />

  <meta property="og:image" content="https://www.ventrio.ind.br/assets/img/vesper_linha_comercial.png" />
  <script>
    (function () {
      const origin = window.location.origin;
      const canonicalLink = document.getElementById('canonical-link');
      if (canonicalLink) {
        canonicalLink.href = origin + '/';
      }
      const ogUrl = document.querySelector('meta[property="og:url"]');
      if (ogUrl) {
        ogUrl.content = origin + '/';
      }
      const ogImage = document.querySelector('meta[property="og:image"]');
      if (ogImage) {
        ogImage.content = ogImage.content.replace(/^https?:\/\/[^/]+/, origin);
      }
      const twitterImage = document.querySelector('meta[name="twitter:image"]');
      if (twitterImage) {
        twitterImage.content = twitterImage.content.replace(/^https?:\/\/[^/]+/, origin);
      }
      const jsonLd = document.querySelector('script[type="application/ld+json"]');
      if (jsonLd) {
        try {
          const data = JSON.parse(jsonLd.textContent);
          if (data) {
            data.url = origin;
            if (typeof data.logo === 'string') {
              data.logo = data.logo.replace(/^https?:\/\/[^/]+/, origin);
            }
            if (typeof data.image === 'string') {
              data.image = data.image.replace(/^https?:\/\/[^/]+/, origin);
            }
            jsonLd.textContent = JSON.stringify(data);
          }
        } catch (e) {
          console.warn('Could not update JSON-LD origin', e);
        }
      }
    })();
  </script>
